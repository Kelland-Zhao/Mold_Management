<script>

  const swalHtml = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;


  let timerInterval,timerIntervalFile;

  /***关闭弹窗时清空模具号与机台号***/

    $(this).find('input[id*=moldNo]').val('');
    $(this).find('select[id*=Machine]').val('').trigger('change');

  /***初始化日期选择器***/
  function initializationDatePicker(){
    $('.data-datepicker').datepicker({
      "language": "zh-CN",
      "calendarWeeks": true,
      "todayHighlight": true
    });
  }
  
  /**渲染维修表格**/
  function renderReTable(arrData){
    let tbody=$("#tbodyReInfo");
    tbody.empty();
    let rowStr="";
    for(let i=0;i<arrData.length;i++){
      rowStr='<tr>'+
              '<td>'+arrData[i][0]+'</td>'+
              '<td>'+arrData[i][1]+'</td>'+
              '<td>'+arrData[i][2]+'</td>'+
              '<td>'+arrData[i][3]+'</td>'+
              '<td>'+arrData[i][4]+'</td>'+
              '<td>'+arrData[i][5]+'</td>'+
              '<td>'+
                '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;">'+
                  '<button class="btn btn-info btn-table-action" onclick="btnInWarehouse(this)"><i class="bi bi-box-arrow-in-right"></i><span>入库</span><span>In</span></button>'+
                  '<button class="btn btn-success btn-table-action" onclick="btnOutWarehouse(this)"><i class="bi bi-box-arrow-up-right"></i><span>出库</span><span>Out</span></button>'+
                  '<button class="btn btn-danger btn-table-action" onclick="btnInstallMold(this)"><i class="bi bi-box-arrow-up"></i><span>上模</span><span>Install</span></button>'+

  /***初始化：加载机台+维修数据（模具状态清单已就绪）***/
  function loadRepairInit(loginWorkshop,loginProcess){
    let t=Swal.getTitle();
    if(t)t.innerHTML=swalTitle('正在加载机台与维修数据……','Loading...');
    google.script.run.withFailureHandler(judgeFailure).withSuccessHandler(result=>{
      if(result[0]=="OK"){
        arrAem=result[1];
        let secTemp=$("#prodInstallMachine");
        dynamicGenerationSelectOption(secTemp,arrAem);
        secTemp=$("#prodUninstallMachine");
        dynamicGenerationSelectOption(secTemp,arrAem);
        google.script.run.withFailureHandler(judgeFailure).withSuccessHandler(result2=>{
          if(result2[0]=="OK"){
            renderReTable(result2[1]);
            showResult('success','数据加载完成','','',false,'',2000,true);
          }
          else{
            $("#tbodyReInfo").empty();
            showResult('info','暂无维修记录',result2[1],'',true,'','',false);
          }
        }).getHistoryUninstall(loginWorkshop,loginProcess,"",[]);
      }
      else{
        showResult('error','机台信息加载失败',result[1],'',true,'','',false);
      }
    }).getAem(loginWorkshop,loginProcess);
  }

  /***加载维修表格数据***/
  function loadReData(){
    let loginWorkshop=$("#loginWorkshop").text().trim();
    let loginProcess=$("#loginProcess").text().trim();
    if(loginWorkshop&&loginProcess){
      showRunning('','正在加载维修记录……','','',120000);
      google.script.run.withFailureHandler(judgeFailure).withSuccessHandler(result=>{
        if(result[0]=="OK"){
          renderReTable(result[1]);
          showResult('success','维修记录加载成功','','',false,'',2000,true)
        }
        else{
          $("#tbodyReInfo").empty();
          showResult('info','暂无维修记录',result[1],'',true,'','',false);
        }
      }).getHistoryUninstall(loginWorkshop,loginProcess,"",[]);
    }
  }

  /***刷新按钮***/
  $("#btnRefreshRe").on("click",loadReData);

  /***加载窗口时预载数据***/
  $(document).ready(function(){
    initializationDatePicker();
    let loginWorkshop=sessionStorage.getItem("sessionLoginWorkshop");
    let loginProcess=sessionStorage.getItem("sessionLoginProcess");
    let loginId=sessionStorage.getItem("sessionLoginId");
    let loginName=sessionStorage.getItem("sessionLoginName");
    $("#loginWorkshop").text(loginWorkshop);
    $("#loginProcess").text(loginProcess);
    $("#loginId").text(loginId);
    $("#loginName").text(loginName);
    $("#name").text(loginName);
    if(loginWorkshop&&loginProcess&&loginId&&loginName){
      // 优先加载模具状态清单，再加载业务数据
      showRunning('','正在加载模具数据……','','',30000);
      google.script.run.withFailureHandler(e=>{
        console.error("[moldStatusMap] preload FAILED:",e);
        loadRepairInit(loginWorkshop,loginProcess);
      }).withSuccessHandler(result=>{
        if(result[0]=="OK"){
          result[1].forEach(r=>{moldStatusMap[r[1]]=r;moldStatusMap[r[1]+"|"+r[3]]=r;});
          console.log("[moldStatusMap] loaded "+Object.keys(moldStatusMap).length+" molds");
        }
        loadRepairInit(loginWorkshop,loginProcess);
      }).getMoldStatusList();
    }
    else{
      showResult('error','缺失登陆信息','尝试关闭窗口重新登陆','',true,'','',false);
    }
  });

  $("#moldNoUninstall").on("blur",function(){
    let inputVal=$("#moldNoUninstall").val()
    let judge=false;
    if(inputVal.indexOf("模具名称")!=-1&&inputVal.indexOf("模具号")!=-1&&inputVal.indexOf("产品名称")!=-1&&inputVal.indexOf("模具步骤")!=-1){
      judge=(/M\dIM\d{4}/).test(inputVal);

      judge=(/^M\dIM\d{4}$/).test(inputVal);

      let loginProcess=$("#loginProcess").text().trim();
      let loginName=$("#loginName").text().trim();
      let now=new Date();
      let nowDate=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
      let nowHour=now.getHours();
      let shift="";
      if(nowHour<8&&nowHour>=0){shift="夜班"}else if(nowHour<16&&nowHour>=8){shift="早班"}else if(nowHour<24&&nowHour>=16){shift="中班"}
      rowStr='<tr>'+

                '<td>'+shift+'</td>'+
                '<td>'+moldNoUninstall+'</td>'+
                '<td>'+machineUninstall+'</td>'+
                '<td>'+moldNoUninstallDes+'</td>'+

                    '<button class="btn btn-success btn-table-action" onclick="btnOutWarehouse(this)"><i class="bi bi-box-arrow-up-right"></i><span>出库</span><span>Out</span></button>'+
                    '<button class="btn btn-danger btn-table-action" onclick="btnInstallMold(this)"><i class="bi bi-box-arrow-up"></i><span>上模</span><span>Install</span></button>'+

                '</td>'+
              '</tr>'

      google.script.run.withFailureHandler(judgeFailure).withSuccessHandler(result=>{
        arrMoldInfoScan=[]

          tbody.append(rowStr);
          showResult('success','下模信息保存成功','','',false,'',2000,true)
        }
        else{
          showResult('error','下模信息保存失败',result[1],'',true,'','',false);
        }
      }).saveReUninstallMold(loginWorkshop,loginProcess,nowDate,shift,moldNoUninstall,machineUninstall,loginName,moldNoUninstallDes,uninstallRemark,arrMoldInfoScan)
    }
  })

  /***动态生成Select的Option项***/
  function dynamicGenerationSelectOption(secTemp,arr){
    secTemp.empty()
    secTemp.append('<option value="">Select……</option>');
    for(let i=0;i<arr.length;i++){
      secTemp.append('<option value="'+arr[i]+'">'+arr[i]+'</option>');
    }
    if (secTemp.hasClass('select2-hidden-accessible')) {
      secTemp.select2('destroy');
    }
    var modal = secTemp.closest('.modal');
    secTemp.select2({
      theme: 'bootstrap',
      placeholder: '选择…… / Select……',
      allowClear: true,
      width: '100%',
      dropdownParent: modal
    });
    if (modal.length) {
      modal.off('shown.bs.modal.s2fix').on('shown.bs.modal.s2fix', function() {
        secTemp.select2({ width: '100%', dropdownParent: modal });
      });
    }
  }

  /***显示过程提示信息***/
  function showRunning(strIcon,strTitle,strText,strFooter,times){
    if(timerInterval){clearInterval(timerInterval)}
    Swal.fire({
      position: 'center',
      allowOutsideClick:false,
      icon:strIcon,
      title: swalTitle(strTitle, 'Loading...'),
      html: swalHtml(strText || '窗口将在 <b></b> 秒内关闭', 'Window will close in <b></b> seconds'),
      showConfirmButton:false,
      footer:strFooter,
      timer: times,
      timerProgressBar: true,
      didOpen: () => {
        Swal.showLoading();
        let b = Swal.getHtmlContainer().querySelector('b');
        timerInterval = setInterval(() => {
          if(b){
            b.textContent = (Swal.getTimerLeft()/1000).toFixed(0);
          }
        }, 1000)
      },
      willClose:()=>{
        if(timerInterval){clearInterval(timerInterval)}
      }
    }).then((result) => {
      if (result.dismiss === Swal.DismissReason.timer) {
        Swal.fire({
          icon: 'error',
          title: swalTitle('超时', 'Timeout'),
          html: swalHtml('程序在'+times/60000+'分钟内未响应，尝试再来一次', 'No response in '+times/60000+' min, please try again')
        });
      }
    })
  }

  /***显示结果提示信息***/
  function showResult(strIcon,strTitle,strText,strHtml,booleanButton,strFooter,times,booleanTimerProgressBar){
    if(timerInterval){clearInterval(timerInterval)}
    Swal.fire({
      position: 'center',
      allowOutsideClick:false,
      icon:strIcon,
      title: swalTitle(strTitle, ''),
      html: strHtml || swalHtml(strText, ''),
      showConfirmButton:booleanButton,
      footer:strFooter,
      timer: times,
      timerProgressBar: booleanTimerProgressBar
    })
  }

  /***后台无响应时返回错误信息***/
  function judgeFailure(){
    Swal.fire({
      icon: 'error',
      title: swalTitle('服务器未响应', 'Server Not Responding'),
      html: swalHtml('尝试再来一次', 'Please try again')
    });
  }
